name: CI/CD Pipeline

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main

env:
  DOCKER_IMAGE_NAME: ocare-health-app
  JAVA_VERSION: '17'

jobs:
  test:
    name: Code Quality & Tests
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: ${{ env.JAVA_VERSION }}
        distribution: 'temurin'
        
    - name: Cache Gradle packages
      uses: actions/cache@v3
      with:
        path: |
          ~/.gradle/caches
          ~/.gradle/wrapper
        key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
        restore-keys: |
          ${{ runner.os }}-gradle-
          
    - name: Grant execute permission for gradlew
      run: chmod +x gradlew
      
    - name: Check code formatting with Spotless
      run: ./gradlew spotlessCheck
      
    - name: Run tests with coverage
      run: ./gradlew test jacocoTestReport
      
    - name: Verify code coverage
      run: ./gradlew jacocoTestCoverageVerification
      
    - name: Generate test report
      uses: dorny/test-reporter@v1
      if: success() || failure()
      with:
        name: Gradle Tests
        path: build/test-results/test/*.xml
        reporter: java-junit
        
    - name: Upload coverage reports to Codecov
      uses: codecov/codecov-action@v3
      if: success() || failure()
      with:
        file: build/reports/jacoco/test/jacocoTestReport.xml
        flags: unittests
        name: codecov-umbrella
        
    - name: Upload JaCoCo coverage to GitHub
      uses: actions/upload-artifact@v3
      if: success() || failure()
      with:
        name: jacoco-report
        path: build/reports/jacoco/test/
        retention-days: 30
        
    - name: Comment coverage on PR
      uses: madrapps/jacoco-report@v1.6.1
      if: github.event_name == 'pull_request'
      with:
        paths: |
          ${{ github.workspace }}/build/reports/jacoco/test/jacocoTestReport.xml
        token: ${{ secrets.GITHUB_TOKEN }}
        min-coverage-overall: 70
        min-coverage-changed-files: 60

  build-and-push:
    name: Build and Push Docker Images
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
      
    - name: Login to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}
        
    - name: Extract metadata for app
      id: meta-app
      uses: docker/metadata-action@v5
      with:
        images: ${{ secrets.DOCKER_USERNAME }}/${{ env.DOCKER_IMAGE_NAME }}
        tags: |
          type=ref,event=branch
          type=ref,event=pr
          type=sha,prefix={{branch}}-
          type=raw,value=latest,enable={{is_default_branch}}
          
    - name: Build and push application image
      uses: docker/build-push-action@v5
      with:
        context: .
        file: ./Dockerfile
        push: true
        tags: ${{ steps.meta-app.outputs.tags }}
        labels: ${{ steps.meta-app.outputs.labels }}
        cache-from: type=gha
        cache-to: type=gha,mode=max
        platforms: linux/amd64,linux/arm64

    - name: Create production docker-compose
      run: |
        # 프로덕션용 docker-compose 파일 생성
        cat > docker-compose.prod.yml << 'EOF'
        version: '3.8'
        
        services:
          mysql:
            image: mysql:8.3
            container_name: ocare-mysql-prod
            restart: unless-stopped
            environment:
              MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
              MYSQL_DATABASE: ${MYSQL_DATABASE}
              MYSQL_USER: ${MYSQL_USER}
              MYSQL_PASSWORD: ${MYSQL_PASSWORD}
              MYSQL_ROOT_HOST: '%'
            ports:
              - "${MYSQL_PORT:-3306}:3306"
            volumes:
              - mysql_data:/var/lib/mysql
            networks:
              - ocare-network
            command: >
              --default-authentication-plugin=mysql_native_password
              --character-set-server=utf8mb4
              --collation-server=utf8mb4_unicode_ci
              --innodb_buffer_pool_size=1G
              --max_connections=300
            healthcheck:
              test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}"]
              timeout: 20s
              retries: 10
              interval: 10s
        
          redis:
            image: redis:7.2-alpine
            container_name: ocare-redis-prod
            restart: unless-stopped
            ports:
              - "${REDIS_PORT:-6379}:6379"
            volumes:
              - redis_data:/data
            networks:
              - ocare-network
            command: redis-server --appendonly yes --maxmemory 512mb --maxmemory-policy allkeys-lru
            healthcheck:
              test: ["CMD", "redis-cli", "ping"]
              timeout: 3s
              retries: 5
              interval: 10s
        
          app:
            image: ${{ secrets.DOCKER_USERNAME }}/${{ env.DOCKER_IMAGE_NAME }}:latest
            container_name: ocare-app-prod
            restart: unless-stopped
            ports:
              - "${APP_PORT:-8080}:8080"
            environment:
              SPRING_PROFILES_ACTIVE: docker
              SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/${MYSQL_DATABASE}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Seoul
              SPRING_DATASOURCE_USERNAME: ${MYSQL_USER}
              SPRING_DATASOURCE_PASSWORD: ${MYSQL_PASSWORD}
              SPRING_REDIS_HOST: redis
              SPRING_REDIS_PORT: 6379
              SPRING_JPA_HIBERNATE_DDL_AUTO: ${JPA_DDL_AUTO:-validate}
              SPRING_JPA_SHOW_SQL: false
              JAVA_OPTS: ${JAVA_OPTS:--Xms1024m -Xmx2048m}
            depends_on:
              mysql:
                condition: service_healthy
              redis:
                condition: service_healthy
            networks:
              - ocare-network
            healthcheck:
              test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/actuator/health"]
              timeout: 5s
              retries: 5
              interval: 30s
        
        volumes:
          mysql_data:
            driver: local
          redis_data:
            driver: local
        
        networks:
          ocare-network:
            driver: bridge
        EOF

    - name: Create deployment package
      run: |
        # 배포용 패키지 생성
        mkdir -p deployment-package
        cp docker-compose.prod.yml deployment-package/
        cp .env.example deployment-package/.env
        
        # 배포 스크립트 생성
        cat > deployment-package/deploy.sh << 'EOF'
        #!/bin/bash
        
        # 색상 정의
        RED='\033[0;31m'
        GREEN='\033[0;32m'
        YELLOW='\033[1;33m'
        NC='\033[0m' # No Color
        
        echo -e "${GREEN}🚀 Starting OCare Health App Deployment${NC}"
        
        # 환경변수 파일 확인
        if [ ! -f .env ]; then
          echo -e "${YELLOW}⚠️  .env file not found. Please copy and configure .env.example${NC}"
          exit 1
        fi
        
        # Docker 및 Docker Compose 확인
        if ! command -v docker &> /dev/null; then
          echo -e "${RED}❌ Docker is not installed${NC}"
          exit 1
        fi
        
        if ! command -v docker-compose &> /dev/null; then
          echo -e "${RED}❌ Docker Compose is not installed${NC}"
          exit 1
        fi
        
        # 기존 컨테이너 정리
        echo -e "${YELLOW}🧹 Cleaning up existing containers...${NC}"
        docker-compose -f docker-compose.prod.yml down --remove-orphans
        
        # 최신 이미지 다운로드
        echo -e "${YELLOW}📥 Pulling latest images...${NC}"
        docker-compose -f docker-compose.prod.yml pull
        
        # 서비스 시작
        echo -e "${YELLOW}🔄 Starting services...${NC}"
        docker-compose -f docker-compose.prod.yml up -d
        
        # 헬스체크 대기
        echo -e "${YELLOW}⏳ Waiting for services to be healthy...${NC}"
        timeout=300  # 5분
        while [ $timeout -gt 0 ]; do
          if docker-compose -f docker-compose.prod.yml ps | grep -q "healthy"; then
            break
          fi
          sleep 5
          timeout=$((timeout-5))
        done
        
        # 배포 상태 확인
        echo -e "${GREEN}📊 Deployment Status:${NC}"
        docker-compose -f docker-compose.prod.yml ps
        
        echo -e "${GREEN}✅ Deployment completed successfully!${NC}"
        echo -e "${GREEN}📱 Application URL: http://localhost:8080${NC}"
        echo -e "${GREEN}🗄️  Database Admin: http://localhost:8081 (if tools profile enabled)${NC}"
        EOF
        
        chmod +x deployment-package/deploy.sh
        
        # README 생성
        cat > deployment-package/README.md << 'EOF'
        # OCare Health App - Production Deployment
        
        ## Prerequisites
        - Docker
        - Docker Compose
        
        ## Quick Start
        
        1. Configure environment variables:
           ```bash
           cp .env.example .env
           # Edit .env with your production values
           ```
        
        2. Deploy the application:
           ```bash
           ./deploy.sh
           ```
        
        ## Environment Variables
        
        | Variable | Description | Default |
        |----------|-------------|---------|
        | MYSQL_ROOT_PASSWORD | MySQL root password | - |
        | MYSQL_DATABASE | Database name | ocare_db |
        | MYSQL_USER | Database user | ocare_user |
        | MYSQL_PASSWORD | Database password | - |
        | APP_PORT | Application port | 8080 |
        | MYSQL_PORT | MySQL port | 3306 |
        | REDIS_PORT | Redis port | 6379 |
        
        ## Services
        
        - **Application**: http://localhost:8080
        - **Health Check**: http://localhost:8080/actuator/health
        - **MySQL**: localhost:3306
        - **Redis**: localhost:6379
        
        ## Commands
        
        ```bash
        # Start services
        docker-compose -f docker-compose.prod.yml up -d
        
        # Stop services
        docker-compose -f docker-compose.prod.yml down
        
        # View logs
        docker-compose -f docker-compose.prod.yml logs -f
        
        # Check status
        docker-compose -f docker-compose.prod.yml ps
        ```
        EOF

    - name: Create deployment artifact
      run: |
        tar -czf ocare-deployment-${{ github.sha }}.tar.gz deployment-package/
        
    - name: Upload deployment artifact
      uses: actions/upload-artifact@v3
      with:
        name: ocare-deployment-package
        path: ocare-deployment-${{ github.sha }}.tar.gz
        retention-days: 30
        
    - name: Update deployment status
      if: success()
      run: |
        echo "🎉 Successfully built and pushed all Docker images"
        echo "App Image: ${{ secrets.DOCKER_USERNAME }}/${{ env.DOCKER_IMAGE_NAME }}:latest"
        echo "📦 Deployment package created: ocare-deployment-${{ github.sha }}.tar.gz"

  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: build-and-push
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    
    steps:
    - name: Run Trivy vulnerability scanner
      uses: aquasecurity/trivy-action@master
      with:
        image-ref: ${{ secrets.DOCKER_USERNAME }}/${{ env.DOCKER_IMAGE_NAME }}:latest
        format: 'sarif'
        output: 'trivy-results.sarif'
        
    - name: Upload Trivy scan results to GitHub Security tab
      uses: github/codeql-action/upload-sarif@v2
      if: always()
      with:
        sarif_file: 'trivy-results.sarif'